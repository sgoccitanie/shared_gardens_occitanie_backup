# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  app.jwtsecret: "%env(JWT_SECRET)%"
  uploads_directory: "%kernel.project_dir%/assets/uploads/"
  kernel.secret: "%env(KERNEL_SECRET)%"
  google_application_credentials: "%kernel.project_dir%/%env(GOOGLE_AUTH_CONFIG)%"
  google_redirect_uri: "%kernel.project_dir%/%env(GOOGLE_REDIRECT_URI)%"
  google_drive_folder_rmorez: "%env(GOOGLE_DRIVE_FOLDER_RMOREZ)%"
  google_drive_folder_rsj: "%env(GOOGLE_DRIVE_FOLDER_RSJ)%"

services:
  # default configuration for services
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
  twig.extension.intl:
    class: Twig\Extra\Intl\IntlExtension

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # Configuration explicite pour commonDataService
  App\Service\CommonDataService:
    arguments:
      $kernelProjectDir: "%kernel.project_dir%"

  App\Security\FormLoginAuthenticator:
    arguments:
      $flashBag: "@session.flash_bag"

  App\Repository\AddressesRepository:
    autowire: true
  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\EventListener\PostContentListener:
    tags:
      - {
          name: kernel.event_listener,
          event: easy_admin.pre_persist,
          method: cleanPostContent,
        }
      - {
          name: kernel.event_listener,
          event: easy_admin.pre_update,
          method: cleanPostContent,
        }
  App\EventListener\NoCacheListener:
    tags:
      - { name: kernel.event_listener, event: kernel.response }
