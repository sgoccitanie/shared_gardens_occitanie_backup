security:
  role_hierarchy:
    ROLE_EDITOR: [ROLE_USER]
    ROLE_ADMIN: [ROLE_EDITOR]
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  # used to reload user from session & other features (e.g. switch_user)
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider
      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800 # 1 week in seconds
        signature_properties: ["password", "updatedAt"]
        token_provider:
          doctrine: true
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        username_parameter: _email
        password_parameter: _password
        default_target_path: admin
        always_use_default_target_path: true
      logout:
        path: app_logout
        target: app_login
        clear_site_data:
          - cookies
          - storage
      login_throttling:
        max_attempts: 5
        interval: "15 minutes"

  # Easy way to control access for large sections of your site
  # Note: Only the *first* access control that matches will be used
  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS } # Accès public au formulaire de connexion
    - { path: ^/admin/login, roles: PUBLIC_ACCESS }
    - { path: ^/admin/users, roles: [ROLE_ADMIN] } # Seuls les admins gèrent les utilisateurs
    - { path: ^/admin/presentation, roles: [ROLE_ADMIN] } # Seuls les admins gèrent la page Présentation
    - { path: ^/admin, roles: [ROLE_EDITOR] } # Les éditeurs accèdent au reste du back-office

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon
